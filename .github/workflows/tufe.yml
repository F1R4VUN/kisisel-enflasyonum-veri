name: tufe

on:
  schedule:
    # Her ayın 3–10. günleri 07:23 UTC (10:23 TR).
    - cron: '23 7 3-10 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Güncel olsa da çek, gecikme alarmını kapat ve yeniden yayınla'
        type: boolean
        default: false

concurrency:
  group: tufe
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.tufe.outputs.changed }}
      latest: ${{ steps.tufe.outputs.latest }}
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: TÜİK verisini çek ve doğrula
        id: tufe
        shell: bash
        env:
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          python scripts/tuik_fetch.py --out docs/v1/tufe.json $FORCE_FLAG \
            2>&1 | tee "$RUNNER_TEMP/tufe.log"

      # Gecikmede (çıkış kodu 3) yeni veri yine de yazılmış olabilir; onu da kaydet.
      # Yalnızca main üzerinde çalışırken push edilir.
      - name: Commit ve push
        id: commit
        if: ${{ !cancelled() && steps.tufe.outputs.changed == 'true' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          LATEST: ${{ steps.tufe.outputs.latest }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898783+github-actions[bot]@users.noreply.github.com'
          git add docs/v1/tufe.json
          git commit -m "TÜFE ${LATEST}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Hata için issue aç
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Otomatik TÜFE güncellemesi başarısız'
          {
            echo "Çalışma: $RUN_URL"
            echo
            echo "Hata özeti:"
            echo
            echo '```'
            if [ -f "$RUNNER_TEMP/tufe.log" ]; then
              grep -E '^::(error|warning) ' "$RUNNER_TEMP/tufe.log" \
                | sed -E 's/^::(error|warning) title=TÜFE::/\1: /; s/%0A/ /g; s/%0D//g; s/%25/%/g' \
                || echo "Betik hata satırı basmadı; çalışma günlüğüne bakın."
            else
              echo "Betik çalışmadı; çalışma günlüğüne bakın."
            fi
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi

  yayinla:
    needs: guncelle
    if: ${{ !cancelled() && (needs.guncelle.outputs.pushed == 'true' || (needs.guncelle.result == 'success' && inputs.force == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
